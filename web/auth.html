<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Inicio de sesión seguro de Seismik.">
  <title>Entrar · Seismik</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">

  <link rel="stylesheet" href="/styles.css">

</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="auth-title">
    <a class="auth-brand" href="https://seismik.org/">
      <img class="brand-logo" src="/assets/seismik_logo.png" alt="">
      <span>SEISMIK</span>
    </a>
    <p class="eyebrow">ACCESO SEGURO</p>
    <h1 id="auth-title">Entra a Seismik Developers</h1>
    <p class="auth-copy">Elige cómo quieres continuar. Seismik sólo solicita tu perfil básico y un correo verificado.</p>
    <div id="providers" class="provider-list" aria-live="polite">
      <button class="provider-button provider-apple" type="button" data-provider="apple"><svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg> Continuar con Apple</button>
      <button class="provider-button" type="button" data-provider="google"><span aria-hidden="true">G</span> Continuar con Google</button>
      <button class="provider-button" type="button" data-provider="github"><span aria-hidden="true">⌘</span> Continuar con GitHub</button>
    </div>
    <p id="availability" class="availability" hidden></p>
    <a class="return-link" href="https://devs.seismik.org/">Volver a Seismik Developers</a>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
