name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest
      - run: ruff check src tests
      - run: mypy src

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    # Comprueba que el release compila de verdad (Dart AOT, Kotlin y R8) sin
    # exponer el keystore de produccion: el APK queda firmado en depuracion y
    # solo se conserva como evidencia de compilacion.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build universal release APK (compile check only)
        run: |
          flutter build apk --release \
            --android-project-arg=seismikUnsignedReleaseCheck=true \
            --dart-define=SEISMIK_API_BASE_URL=https://api.example.invalid
      - name: Verify the APK is universal
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          abis=$(unzip -l "$apk" | awk -F/ '/^.*lib\// {print $2}' | sort -u)
          echo "$abis"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$abis" | grep -qx "$abi" || { echo "Falta la ABI $abi"; exit 1; }
          done

  ios:
    # iOS solo puede compilarse en macOS. Sin certificados no se puede firmar,
    # pero --no-codesign verifica el proyecto Xcode, los Pods y el AOT de Dart.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install CocoaPods dependencies
        run: |
          flutter precache --ios
          cd ios && pod install --repo-update
      - name: Build iOS without code signing
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SEISMIK_API_BASE_URL=https://api.example.invalid
      - name: Verify critical alert entitlement and map schemes survive the build
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          plutil -p "$app/Info.plist" | grep -q 'comgooglemaps'
          plutil -p "$app/Info.plist" | grep -q 'LSApplicationQueriesSchemes'
          grep -q 'usernotifications.critical-alerts' ios/Runner/Runner.entitlements
