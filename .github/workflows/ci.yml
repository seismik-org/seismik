name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest
      - run: ruff check src tests
      - run: mypy src

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    # Comprueba que el release compila de verdad (Dart AOT, Kotlin y R8) sin
    # exponer el keystore de produccion: el APK queda firmado en depuracion y
    # solo se conserva como evidencia de compilacion.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build universal release APK (compile check only)
        run: |
          flutter build apk --release \
            --android-project-arg=seismikUnsignedReleaseCheck=true \
            --dart-define=SEISMIK_API_BASE_URL=https://api.example.invalid
      - name: Verify the APK is universal
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          abis=$(unzip -l "$apk" | awk -F/ '/^.*lib\// {print $2}' | sort -u)
          echo "$abis"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$abis" | grep -qx "$abi" || { echo "Falta la ABI $abi"; exit 1; }
          done

  ios:
    # iOS solo puede compilarse en macOS. Sin certificados no se puede firmar,
    # pero --no-codesign verifica el proyecto Xcode, los Pods y el AOT de Dart.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Provide a placeholder Firebase configuration
        # El proyecto Xcode copia GoogleService-Info.plist como recurso, asi que
        # su ausencia rompe la compilacion antes de llegar al codigo. El archivo
        # real llega desde un secreto solo en el workflow de TestFlight; aqui
        # basta un plist valido porque este job compila y nunca ejecuta la app.
        run: |
          set -euo pipefail
          test ! -f ios/Runner/GoogleService-Info.plist
          cat > ios/Runner/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>ci-placeholder-not-a-real-key</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.seismik.app</string>
            <key>PROJECT_ID</key><string>ci-placeholder</string>
            <key>STORAGE_BUCKET</key><string>ci-placeholder.appspot.com</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint ios/Runner/GoogleService-Info.plist
      - name: Install CocoaPods dependencies
        run: |
          flutter precache --ios
          cd ios && pod install --repo-update
      - name: Build iOS without code signing
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SEISMIK_API_BASE_URL=https://api.example.invalid
      - name: Run the native Swift unit tests
        # La app de iPhone es Swift nativo: `flutter test` no la toca. Sin este
        # paso, CI en verde sólo diría que el Swift compila.
        run: |
          set -euo pipefail
          # El nombre del simulador cambia con cada imagen del runner; se toma
          # el primer iPhone disponible en lugar de fijar un modelo.
          simulator=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, entries in devices.items():
              if 'iOS' not in runtime:
                  continue
              for entry in entries:
                  if entry.get('isAvailable') and 'iPhone' in entry['name']:
                      print(entry['udid'])
                      raise SystemExit(0)
          raise SystemExit('No hay simuladores de iPhone disponibles')
          ")
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$simulator" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify critical alert entitlement and map schemes survive the build
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          plutil -p "$app/Info.plist" | grep -q 'comgooglemaps'
          plutil -p "$app/Info.plist" | grep -q 'LSApplicationQueriesSchemes'
          grep -q 'usernotifications.critical-alerts' ios/Runner/Runner.entitlements
