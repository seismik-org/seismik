name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.1"

  # Valores públicos; la identidad de Google llega mediante OIDC, nunca desde
  # una clave JSON guardada en GitHub. Las dos variables WIF se crean una vez
  # siguiendo deploy/GITHUB_ACTIONS.md.
  GCP_PROJECT_ID: "seismik-15bbb"
  GCP_REGION: "us-east1"
  GCP_ARTIFACT_REPOSITORY: "seismik"

jobs:
  changes:
    # No se despliega todo por un cambio de iOS o de documentación. Estos
    # indicadores sólo habilitan el servicio Cloud Run que recibió código.
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      dispatcher: ${{ steps.filter.outputs.dispatcher }}
      integrations: ${{ steps.filter.outputs.integrations }}
      detector: ${{ steps.filter.outputs.detector }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # La API, el dispatcher e integraciones se importan entre sí: el
          # dispatcher decide la alarma con `api/felt_area.py` y la API usa
          # `eew/official.py` y `dispatcher/policy.py`. Un cambio en cualquiera
          # de esos paquetes redespliega los tres; el detector sólo usa `eew`.
          filters: |
            api:
              - 'src/api/**'
              - 'src/dispatcher/**'
              - 'src/integrations/**'
              - 'src/eew/**'
              - 'src/crowdsourcing/**'
              - 'src/reporting/**'
              - 'requirements-backend.txt'
              - 'Dockerfile.api'
              - 'config.global.json'
              - 'official_sources.json'
              - 'deploy/cloudbuild.api.yaml'
            web:
              - 'web/**'
              - 'Dockerfile.web'
              - 'deploy/Caddyfile.web'
              - 'deploy/cloudbuild.worker.yaml'
            dispatcher:
              - 'src/api/**'
              - 'src/dispatcher/**'
              - 'src/integrations/**'
              - 'src/eew/**'
              - 'src/crowdsourcing/**'
              - 'src/reporting/**'
              - 'requirements-backend.txt'
              - 'Dockerfile.dispatcher'
              - 'official_sources.json'
              - 'deploy/cloudbuild.worker.yaml'
            integrations:
              - 'src/api/**'
              - 'src/dispatcher/**'
              - 'src/integrations/**'
              - 'src/eew/**'
              - 'src/crowdsourcing/**'
              - 'src/reporting/**'
              - 'requirements-backend.txt'
              - 'Dockerfile.integrations'
              - 'official_sources.json'
              - 'deploy/cloudbuild.worker.yaml'
            detector:
              - 'src/eew/**'
              - 'requirements-detector.txt'
              - 'Dockerfile'
              - 'config.json'
              - 'official_sources.json'
              - 'deploy/cloudbuild.worker.yaml'

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest
      - run: ruff check src tests
      - run: mypy src

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    # Comprueba que el release compila de verdad (Dart AOT, Kotlin y R8) sin
    # exponer el keystore de produccion: el APK queda firmado en depuracion y
    # solo se conserva como evidencia de compilacion.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build universal release APK (compile check only)
        run: |
          flutter build apk --release \
            --android-project-arg=seismikUnsignedReleaseCheck=true \
            --dart-define=SEISMIK_API_BASE_URL=https://api.example.invalid
      - name: Verify the APK is universal
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          abis=$(unzip -l "$apk" | awk -F/ '/^.*lib\// {print $2}' | sort -u)
          echo "$abis"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$abis" | grep -qx "$abi" || { echo "Falta la ABI $abi"; exit 1; }
          done

  ios:
    # iOS solo puede compilarse en macOS. Sin certificados no se puede firmar,
    # pero --no-codesign verifica el proyecto Xcode, los Pods y el AOT de Dart.
    # Liquid Glass sólo se incorpora al enlazar con el SDK de Xcode 26.
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26 SDK
        run: |
          xcodebuild -version
          xcodebuild -version | grep -Eq '^Xcode 26\.'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Provide a placeholder Firebase configuration
        # El proyecto Xcode copia GoogleService-Info.plist como recurso, asi que
        # su ausencia rompe la compilacion antes de llegar al codigo. El archivo
        # real llega desde un secreto solo en el workflow de TestFlight; aqui
        # Los XCTest no inicializan servicios de red; AppDelegate aísla el host.
        run: |
          set -euo pipefail
          test ! -f ios/Runner/GoogleService-Info.plist
          cat > ios/Runner/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>ci-placeholder-not-a-real-key</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>com.seismik.app</string>
            <key>PROJECT_ID</key><string>ci-placeholder</string>
            <key>STORAGE_BUCKET</key><string>ci-placeholder.appspot.com</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><false/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint ios/Runner/GoogleService-Info.plist
      - name: Install CocoaPods dependencies
        run: |
          flutter precache --ios
          cd ios && pod install --repo-update
      - name: Build iOS without code signing
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SEISMIK_API_BASE_URL=https://api.example.invalid
      - name: Verify critical alert entitlement and map schemes survive the build
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          plutil -p "$app/Info.plist" | grep -q 'comgooglemaps'
          plutil -p "$app/Info.plist" | grep -q 'LSApplicationQueriesSchemes'
          grep -q 'usernotifications.critical-alerts' ios/Runner/Runner.entitlements
      - name: Run native SwiftUI unit tests on iPhone simulator
        timeout-minutes: 25
        run: |
          set -euo pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for key,group in devices.items() if "iOS" in key for d in group if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO -resultBundlePath build/NativeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO SEISMIK_API_BASE_URL=https://api.example.invalid
      - name: Upload native XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-tests
          path: mobile_app/build/NativeTests.xcresult
          if-no-files-found: ignore

  deploy-api:
    name: Deploy API to Cloud Run
    needs: [changes, backend, mobile, android, ios]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.api == 'true' &&
      needs.backend.result == 'success' && needs.mobile.result == 'success' &&
      needs.android.result == 'success' && needs.ios.result == 'success' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cloud-run-api-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build immutable image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/api:${{ github.sha }}
        run: gcloud builds submit --config deploy/cloudbuild.api.yaml --substitutions=_IMAGE="$IMAGE"
      - name: Update service
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/api:${{ github.sha }}
        run: gcloud run services update seismik-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE"

  deploy-web:
    name: Deploy developer web to Cloud Run
    needs: [changes, backend, mobile, android, ios]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.web == 'true' &&
      needs.backend.result == 'success' && needs.mobile.result == 'success' &&
      needs.android.result == 'success' && needs.ios.result == 'success' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cloud-run-web-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build immutable image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/web:${{ github.sha }}
        run: gcloud builds submit --config deploy/cloudbuild.worker.yaml --substitutions=_IMAGE="$IMAGE",_DOCKERFILE=Dockerfile.web
      - name: Update service
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/web:${{ github.sha }}
        run: gcloud run services update seismik-web --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE"

  deploy-workers:
    name: Deploy affected workers to Cloud Run
    needs: [changes, backend, mobile, android, ios]
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.dispatcher == 'true' || needs.changes.outputs.integrations == 'true' || needs.changes.outputs.detector == 'true') &&
      needs.backend.result == 'success' && needs.mobile.result == 'success' &&
      needs.android.result == 'success' && needs.ios.result == 'success' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: cloud-run-workers-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and update only changed worker services
        env:
          DISPATCHER_CHANGED: ${{ needs.changes.outputs.dispatcher }}
          INTEGRATIONS_CHANGED: ${{ needs.changes.outputs.integrations }}
          DETECTOR_CHANGED: ${{ needs.changes.outputs.detector }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY"
          deploy_worker() {
            # En un mismo `local` las expansiones ocurren antes de asignar:
            # `$service` en `image=` saldría vacía y `set -u` aborta el paso.
            local service="$1"
            local dockerfile="$2"
            local image="$repo/$service:$SHA"
            gcloud builds submit --config deploy/cloudbuild.worker.yaml \
              --substitutions=_IMAGE="$image",_DOCKERFILE="$dockerfile"
            gcloud run services update "$service" --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" --image "$image"
          }
          [ "$DISPATCHER_CHANGED" = true ] && deploy_worker seismik-dispatcher Dockerfile.dispatcher
          [ "$INTEGRATIONS_CHANGED" = true ] && deploy_worker seismik-integrations Dockerfile.integrations
          [ "$DETECTOR_CHANGED" = true ] && deploy_worker seismik-detector Dockerfile
