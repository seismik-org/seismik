name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Subir el IPA firmado a TestFlight"
        required: true
        default: false
        type: boolean
      critical_alerts_approved:
        description: "El provisioning profile ya contiene Critical Alerts aprobado por Apple"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  signed-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Import distribution certificate and provisioning profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$IOS_CERTIFICATE_BASE64"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"
          certificate_path="$RUNNER_TEMP/seismik-distribution.p12"
          profile_path="$RUNNER_TEMP/seismik.mobileprovision"
          keychain_path="$RUNNER_TEMP/seismik-signing.keychain-db"
          CERT_B64="$IOS_CERTIFICATE_BASE64" PROFILE_B64="$IOS_PROVISIONING_PROFILE_BASE64" CERT_OUT="$certificate_path" PROFILE_OUT="$profile_path" python3 - <<'PY'
          import base64, os, re
          for env_name, out_name in (("CERT_B64", "CERT_OUT"), ("PROFILE_B64", "PROFILE_OUT")):
              raw = os.environ[env_name]
              # GitHub secret pastes may contain wrapping whitespace; ignore it safely.
              clean = re.sub(r"[^A-Za-z0-9+/=]", "", raw)
              clean += "=" * (-len(clean) % 4)
              with open(os.environ[out_name], "wb") as stream:
                  stream.write(base64.b64decode(clean, validate=False))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_uuid=$(security cms -D -i "$profile_path" | plutil -extract UUID raw -)
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
      - name: Build signed IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SEISMIK_GOOGLE_MAPS_API_KEY: ${{ secrets.SEISMIK_GOOGLE_MAPS_API_KEY }}
          IOS_GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          # Firebase must be configured in the signed iOS bundle.  This file
          # contains a public Firebase app identifier but is kept as a GitHub
          # secret so its API configuration never becomes a repository file.
          test -n "$IOS_GOOGLE_SERVICE_INFO_BASE64"
          echo "$IOS_GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          cp ios/Flutter/Seismik.xcconfig.example ios/Flutter/Seismik.xcconfig
          printf '\nDEVELOPMENT_TEAM = %s\nSEISMIK_GOOGLE_MAPS_API_KEY = %s\n' "$APPLE_TEAM_ID" "$SEISMIK_GOOGLE_MAPS_API_KEY" >> ios/Flutter/Seismik.xcconfig
          # Use the imported App Store distribution profile instead of Xcode's automatic (development) signing.
          printf '\nCODE_SIGN_STYLE = Manual\nCODE_SIGN_IDENTITY = Apple Distribution\nPROVISIONING_PROFILE_SPECIFIER = Seismik App Store Connect\n' >> ios/Flutter/Seismik.xcconfig
          if [[ "${{ inputs.critical_alerts_approved }}" != "true" ]]; then
            sed -i '' 's#^SEISMIK_ENTITLEMENTS_FILE = .*#SEISMIK_ENTITLEMENTS_FILE = Runner.basic.entitlements#' ios/Flutter/Release.xcconfig
          fi
          sed "s/__APPLE_TEAM_ID__/$APPLE_TEAM_ID/g" ios/ExportOptions.plist.template > ios/ExportOptions.plist
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define=SEISMIK_API_BASE_URL=https://api.seismik.org --dart-define=SEISMIK_INTEGRITY_REQUIRED=true
          ipa_file=$(find "$PWD/build/ios" -type f -name '*.ipa' -print -quit)
          test -n "$ipa_file"
      - name: Verify signed entitlements
        run: |
          set -euo pipefail
          app=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/entitlements.plist" 2> "$RUNNER_TEMP/codesign.log"
          plutil -p "$RUNNER_TEMP/entitlements.plist" | grep -q 'aps-environment'
          if [[ "${{ inputs.critical_alerts_approved }}" == "true" ]]; then
            plutil -p "$RUNNER_TEMP/entitlements.plist" | grep -q 'usernotifications.critical-alerts'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: seismik-ios-ipa
          path: ${{ github.workspace }}/mobile_app/build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          SEISMIK_IPA_PATH: build/ios/ipa/seismik.ipa
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64"
          key_path="$RUNNER_TEMP/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          api_path="$RUNNER_TEMP/app-store-connect-api-key.json"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/app-store-connect-api-key.json', 'w') as stream:
              json.dump({'key_id': os.environ['APP_STORE_CONNECT_KEY_ID'], 'issuer_id': os.environ['APP_STORE_CONNECT_ISSUER_ID'], 'key': open(os.environ['RUNNER_TEMP'] + '/AuthKey_' + os.environ['APP_STORE_CONNECT_KEY_ID'] + '.p8').read(), 'in_house': False}, stream)
          PY
          gem install fastlane --no-document
          APP_STORE_CONNECT_API_KEY_PATH="$api_path" bundle exec fastlane ios upload_testflight || APP_STORE_CONNECT_API_KEY_PATH="$api_path" fastlane ios upload_testflight
