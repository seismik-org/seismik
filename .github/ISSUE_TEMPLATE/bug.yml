name: Error
description: Reportar un defecto reproducible sin datos sensibles
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: No publiques ubicaciones, tokens, credenciales ni vulnerabilidades.
  - type: textarea
    id: description
    attributes:
      label: Descripción
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproducción mínima
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión o commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [Detector, API, Dispatcher, Crowdsourcing, Android, iOS, Documentación]
    validations:
      required: true
