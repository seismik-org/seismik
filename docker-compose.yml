services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    ports:
      # Cloud Run llega únicamente por IP privada de la VPC. El firewall no
      # publica 6379 a Internet; no uses esta apertura sin esa regla interna.
      - "0.0.0.0:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
    networks: [seismik-internal]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment: &seismik-environment
      PORT: 8000
      SEISMIK_ENVIRONMENT: ${SEISMIK_ENVIRONMENT:-development}
      # Permite el corte a Memorystore sin modificar los demás servicios.
      SEISMIK_REDIS_URL: ${SEISMIK_REDIS_URL:-redis://redis:6379/0}
      SEISMIK_OAUTH_GOOGLE_CLIENT_ID: ${SEISMIK_OAUTH_GOOGLE_CLIENT_ID:-}
      SEISMIK_OAUTH_GOOGLE_CLIENT_SECRET: ${SEISMIK_OAUTH_GOOGLE_CLIENT_SECRET:-}
      SEISMIK_OAUTH_GOOGLE_REDIRECT_URI: ${SEISMIK_OAUTH_GOOGLE_REDIRECT_URI:-https://auth.seismik.org/v1/oauth/google/callback}
      SEISMIK_OAUTH_GITHUB_CLIENT_ID: ${SEISMIK_OAUTH_GITHUB_CLIENT_ID:-}
      SEISMIK_OAUTH_GITHUB_CLIENT_SECRET: ${SEISMIK_OAUTH_GITHUB_CLIENT_SECRET:-}
      SEISMIK_OAUTH_GITHUB_REDIRECT_URI: ${SEISMIK_OAUTH_GITHUB_REDIRECT_URI:-https://auth.seismik.org/v1/oauth/github/callback}
      SEISMIK_OAUTH_COOKIE_DOMAIN: ${SEISMIK_OAUTH_COOKIE_DOMAIN:-.seismik.org}
      SEISMIK_DEVELOPER_PORTAL_URL: ${SEISMIK_DEVELOPER_PORTAL_URL:-https://devs.seismik.org/}
      SEISMIK_WEBHOOK_HMAC_SECRET: ${SEISMIK_WEBHOOK_HMAC_SECRET:-local-webhook-secret-change-me}
      SEISMIK_DEVICE_SESSION_TTL_SECONDS: ${SEISMIK_DEVICE_SESSION_TTL_SECONDS:-2592000}
      SEISMIK_CONSUMER_API_KEY: ${SEISMIK_CONSUMER_API_KEY:-}
      SEISMIK_CROWD_MASTER_SECRET: ${SEISMIK_CROWD_MASTER_SECRET:-local-crowd-secret-change-me}
      SEISMIK_INTEGRATION_WEBHOOK_MASTER_SECRET: ${SEISMIK_INTEGRATION_WEBHOOK_MASTER_SECRET:-local-integration-secret-change-me}
      SEISMIK_PUSH_ENABLED: ${SEISMIK_PUSH_ENABLED:-false}
      SEISMIK_PUSH_MODE: ${SEISMIK_PUSH_MODE:-dry_run}
      SEISMIK_PUSH_TEST_DEVICE_IDS: ${SEISMIK_PUSH_TEST_DEVICE_IDS:-[]}
      SEISMIK_INTEGRITY_VERIFICATION_ENABLED: ${SEISMIK_INTEGRITY_VERIFICATION_ENABLED:-false}
      SEISMIK_ALERT_COOLDOWN_SECONDS: ${SEISMIK_ALERT_COOLDOWN_SECONDS:-60}
      SEISMIK_ALERT_DEDUP_SECONDS: ${SEISMIK_ALERT_DEDUP_SECONDS:-1800}
      SEISMIK_ALERT_LEDGER_MAXLEN: ${SEISMIK_ALERT_LEDGER_MAXLEN:-10000}
      SEISMIK_ALERT_RECENT_LIMIT: ${SEISMIK_ALERT_RECENT_LIMIT:-50}
      SEISMIK_GEOFENCE_RADIUS_KM: ${SEISMIK_GEOFENCE_RADIUS_KM:-250}
      SEISMIK_APNS_KEY_PATH: ${SEISMIK_APNS_KEY_PATH:-}
      SEISMIK_APNS_KEY_ID: ${SEISMIK_APNS_KEY_ID:-}
      SEISMIK_APNS_TEAM_ID: ${SEISMIK_APNS_TEAM_ID:-}
      SEISMIK_APNS_TOPIC: ${SEISMIK_APNS_TOPIC:-}
      SEISMIK_APNS_USE_SANDBOX: ${SEISMIK_APNS_USE_SANDBOX:-false}
      SEISMIK_FIREBASE_CREDENTIALS_PATH: ${SEISMIK_FIREBASE_CREDENTIALS_PATH:-}
      SEISMIK_FIREBASE_WEB_API_KEY: ${SEISMIK_FIREBASE_WEB_API_KEY:-}
      SEISMIK_FIREBASE_WEB_AUTH_DOMAIN: ${SEISMIK_FIREBASE_WEB_AUTH_DOMAIN:-}
      SEISMIK_FIREBASE_WEB_PROJECT_ID: ${SEISMIK_FIREBASE_WEB_PROJECT_ID:-}
      SEISMIK_FIREBASE_WEB_APP_ID: ${SEISMIK_FIREBASE_WEB_APP_ID:-}
      SEISMIK_DEVELOPER_PORTAL_ORIGINS: '${SEISMIK_DEVELOPER_PORTAL_ORIGINS:-["https://devs.seismik.org"]}'
      SEISMIK_DEVELOPER_TERMS_VERSION: ${SEISMIK_DEVELOPER_TERMS_VERSION:-2026-08-30}
      SEISMIK_DEVELOPER_MAX_ACTIVE_KEYS: ${SEISMIK_DEVELOPER_MAX_ACTIVE_KEYS:-3}
      SEISMIK_DEVELOPER_FREE_REQUESTS_PER_MINUTE: ${SEISMIK_DEVELOPER_FREE_REQUESTS_PER_MINUTE:-60}
      SEISMIK_DEVELOPER_FREE_REQUESTS_PER_DAY: ${SEISMIK_DEVELOPER_FREE_REQUESTS_PER_DAY:-10000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=1)"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks: [seismik-internal]

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    restart: unless-stopped
    environment: *seismik-environment
    depends_on:
      redis:
        condition: service_healthy
    networks: [seismik-internal]

  integrations:
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    command: ["python", "-m", "dispatcher.integrations"]
    restart: unless-stopped
    environment: *seismik-environment
    depends_on:
      redis:
        condition: service_healthy
    networks: [seismik-internal]

  detector:
    profiles: ["detector"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WEBHOOK_BASE_URL: http://api:8000
      WEBHOOK_HMAC_SECRET: ${SEISMIK_WEBHOOK_HMAC_SECRET:-local-webhook-secret-change-me}
      # Cola durable del enlace detector -> API: ningun candidato se pierde
      # mientras la API se reinicia.
      SEISMIK_ALERT_SPOOL_DIR: /var/lib/seismik/spool
      LOG_LEVEL: INFO
    volumes:
      - detector-spool:/var/lib/seismik/spool
    depends_on:
      api:
        condition: service_healthy
    networks: [seismik-internal]

volumes:
  redis-data:
  detector-spool:

networks:
  seismik-internal:
    driver: bridge
