substitutions:
  _IMAGE: ""
  _DOCKERFILE: "Dockerfile.dispatcher"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - ${_DOCKERFILE}
      - --tag
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

# Los registros van a Cloud Logging: así `gcloud builds submit` los puede
# mostrar a la cuenta de despliegue de GitHub con `roles/logging.viewer`, sin
# darle lectura de todo el proyecto.
options:
  logging: CLOUD_LOGGING_ONLY
