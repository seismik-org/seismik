name: seismik
description: Cliente móvil multiplataforma de alerta sísmica temprana Seismik.
publish_to: none
version: 1.0.0+26

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^7.1.1
  crypto: ^3.0.7
  firebase_app_check: ^0.4.6
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  geolocator: ^14.0.3
  http: ^1.6.0
  provider: ^6.1.5+1
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0
  google_maps_flutter: ^2.18.0
  dynamic_color: 1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # alarm.aiff (iOS) y res/raw/alarm.wav (Android) son recursos nativos.

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/seismik_logo.png
  adaptive_icon_background: "#101522"
  adaptive_icon_foreground: assets/images/seismik_logo.png
  min_sdk_android: 24
  remove_alpha_ios: true
