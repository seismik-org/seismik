name: seismik
description: Cliente móvil multiplataforma de alerta sísmica temprana Seismik.
publish_to: none
version: 0.4.0+4

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^7.1.1
  crypto: ^3.0.7
  dynamic_color: 1.8.1
  firebase_app_check: ^0.4.6
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  flutter_map: ^8.3.1
  geolocator: ^14.0.3
  http: ^1.6.0
  latlong2: ^0.10.1
  provider: ^6.1.5+1
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # alarm.aiff (iOS) y res/raw/alarm.wav (Android) son recursos nativos.
